# SPEC §16.1 levels that run in CI, on an Apple Silicon runner (T-6.8).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package tests and format
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift format lint --strict --recursive App Packages
      # Unit, integration and conformance tests, plus the NFR-17 import check (ArchitectureTests).
      - run: swift test --package-path Packages/ContribusageKit -Xswiftc -warnings-as-errors

  app:
    name: App build (arm64 only)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -project Contribusage.xcodeproj -scheme Contribusage -configuration Release -derivedDataPath .build/xcode build
      - name: Architecture and deployment target (NFR-16)
        run: |
          app=.build/xcode/Build/Products/Release/contribusage.app
          test "$(lipo -archs "$app/Contents/MacOS/contribusage")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 14.0
      # Every string the build extracted is in its catalog, no catalog key is stale, and every key meant for
      # translation has its German one. To fix the first two, run the same sync on the catalog itself after a build.
      # The copy keeps the catalog's name: it is the table name sync matches.
      - name: String Catalogs match the code (NFR-10)
        run: |
          built=.build/xcode/Build/Intermediates.noindex/
          check() { # catalog, build folder, target
            cp "$1" "$RUNNER_TEMP/"
            xcrun xcstringstool sync "$RUNNER_TEMP/$(basename "$1")" \
              --stringsdata $(find "$built$2" -path "*/$3*" -name '*.stringsdata')
            diff -u "$1" "$RUNNER_TEMP/$(basename "$1")"
            untranslated=$(jq -r '.strings | to_entries[] | select(.value.shouldTranslate != false
              and .value.localizations.de.stringUnit.state != "translated") | .key' "$1")
            test -z "$untranslated" || { echo "No German translation in $1:"; echo "$untranslated"; exit 1; }
          }
          check App/Resources/Localizable.xcstrings Contribusage.build/Release Contribusage
          check Packages/ContribusageKit/Sources/ContribusageCore/Resources/Localizable.xcstrings \
            ContribusageKit.build/Release ContribusageCore
          check Packages/ContribusageKit/Sources/ContribusageClaudeCode/Resources/Localizable.xcstrings \
            ContribusageKit.build/Release ContribusageClaudeCode

  wiki:
    name: Wiki lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the stale-page check compares commit times
      - run: llm-wiki/tools/wiki.sh lint
      - run: llm-wiki/tools/test-wiki.sh

  # A version bump that lands on main becomes the GitHub release v<MARKETING_VERSION> with generated notes and the
  # app as an arm64 DMG, ad-hoc signed and not notarized (ADR-006, T-6.7). Later pushes find the release and stop.
  release:
    name: Release on version bump
    if: github.event_name == 'push'
    needs: [package, app, wiki]
    runs-on: macos-26
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: New version
        id: version
        run: |
          v=$(grep -o 'MARKETING_VERSION = [^;]*' Contribusage.xcodeproj/project.pbxproj | cut -d' ' -f3 | sort -u)
          # Debug and Release share one version of digits and dots.
          [[ $v =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::MARKETING_VERSION is not one version: $v"; exit 1; }
          gh release view "v$v" >/dev/null 2>&1 || echo "new=$v" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.new
        run: xcodebuild -project Contribusage.xcodeproj -scheme Contribusage -configuration Release -derivedDataPath .build/xcode build
      - if: steps.version.outputs.new
        name: DMG and release
        env:
          VERSION: ${{ steps.version.outputs.new }}
        run: |
          mkdir dmg
          ditto .build/xcode/Build/Products/Release/contribusage.app dmg/contribusage.app
          ln -s /Applications dmg/Applications
          # ponytail: hdiutil on hosted runners sometimes fails with "Resource busy"; three tries, then the job fails.
          for try in 1 2 3; do
            hdiutil create -volname contribusage -srcfolder dmg -format UDZO "contribusage-$VERSION.dmg" && break
            sleep 10
          done
          gh release create "v$VERSION" "contribusage-$VERSION.dmg" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
